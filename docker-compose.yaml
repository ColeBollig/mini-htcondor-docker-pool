services:
   # Set up Central Manager host
   cm:
      build:
         context: ./system
         dockerfile: cm/Dockerfile
         args:
             AP_HOSTNAME: ${AP_HOST}
             EP_HOSTNAME: ${EP_HOST}
             SIGNING_SECRET: ${SECRET}
             USER_PASSWORD: ${USER_PASSWORD}
             USER_NAME: ${USER_NAME}
      hostname: ${CM_HOST}
      ports:
         - 2000:22
      environment:
         - CONDOR_HOST=${CM_HOST}
      networks:
         - compute
      volumes:
         # Optional: drop files here to have them copied into
         # /home/${USER_NAME}/copy on this host at container start.
         - ./shared/copy/cm:/mnt/copy-in:ro

   # Set up Access Point host 
   ap:
      build:
         context: ./system
         dockerfile: ap/Dockerfile
         args:
             CM_HOSTNAME: ${CM_HOST}
             REMOTE_HOSTNAME: ${REMOTE_HOST}
             SIGNING_SECRET: ${SECRET}
             USER_PASSWORD: ${USER_PASSWORD}
             USER_NAME: ${USER_NAME}
      hostname: ${AP_HOST}
      ports:
         - 2001:22
      environment:
         - CONDOR_HOST=${CM_HOST}
      networks:
         - compute
      volumes:
         # Optional: drop files here to have them copied into
         # /home/${USER_NAME}/copy on this host at container start.
         - ./shared/copy/ap:/mnt/copy-in:ro
         # Optional: live read/write mount for testing, no copy step.
         # Host path is user-configurable via AP_TESTING_MOUNT in .env.
         - ${AP_TESTING_MOUNT:-./shared/mount/ap}:/home/${USER_NAME}/testing
         # Shared drive between AP and EP, mirroring CHTC's /staging - for
         # large-input jobs that pull data via `file://` instead of the
         # normal schedd-mediated transfer. Host path is configurable via
         # STAGING_MOUNT in .env.
         - ${STAGING_MOUNT:-./shared/staging}:/staging
      depends_on:
         - cm

   # Set up Execution Point host
   ep:
      build:
         context: ./system
         dockerfile: ep/Dockerfile
         args:
             CM_HOSTNAME: ${CM_HOST}
             SIGNING_SECRET: ${SECRET}
             USER_PASSWORD: ${USER_PASSWORD}
             USER_NAME: ${USER_NAME}
      hostname: ${EP_HOST}
      ports:
         - 2002:22
      environment:
         - CONDOR_HOST=${CM_HOST}
      networks:
         - compute
      volumes:
         # Optional: drop files here to have them copied into
         # /home/${USER_NAME}/copy on this host at container start.
         - ./shared/copy/ep:/mnt/copy-in:ro
         # Shared drive between AP and EP, mirroring CHTC's /staging - see
         # the ap service above. Host path is configurable via
         # STAGING_MOUNT in .env.
         - ${STAGING_MOUNT:-./shared/staging}:/staging
      depends_on:
         - cm

   # Set up Remote Submission host 
   # Note: Only contains HTCondor python API
   remote:
     build:
        context: ./remote
        args:
            AP_HOSTNAME: ${AP_HOST}
            CM_HOSTNAME: ${CM_HOST}
            USER_PASSWORD: ${USER_PASSWORD}
            USER_NAME: ${USER_NAME}
     hostname: ${REMOTE_HOST}
     ports:
        - 2003:22
     networks:
        - compute
     volumes:
        # Optional: drop files here to have them copied into
        # /home/${USER_NAME}/copy on this host at container start.
        - ./shared/copy/remote:/mnt/copy-in:ro
        # Optional: live read/write mount for testing, no copy step.
        # Host path is user-configurable via REMOTE_TESTING_MOUNT in .env.
        - ${REMOTE_TESTING_MOUNT:-./shared/mount/remote}:/home/${USER_NAME}/testing
     depends_on:
        - ap

networks:
   compute:
