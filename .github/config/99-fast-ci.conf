# CI-only: shrink the default negotiation/update intervals so the pool
# matches and reports state fast enough for a short-lived test run instead
# of on HTCondor's normal (minutes-scale) production cadence. Not meant for
# system/config/ outside of CI - see .github/workflows/htcondor-pool.yml.
NEGOTIATOR_INTERVAL = 5
NEGOTIATOR_CYCLE_DELAY = 5
UPDATE_INTERVAL = 5
SCHEDD_INTERVAL = 5
